name: Run Tests on Push and PR

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint (Only If JS Changed)
        run: git diff --name-only HEAD^ HEAD | grep -E '\.js$' && npx eslint . --quiet || echo "No JS changes, skipping lint."

      - name: Run Tests (Faster for PRs)
        run: npm test ${{ github.ref == 'refs/heads/main' && '-- --coverage' || '-- --onlyChanged' }}

      - name: Upload Coverage Report (Only for Main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage
